[project]
name = "demo-tts"
version = "0.0.0"
description = "Kokoro voice-over for sprint demos"
requires-python = ">=3.12,<3.13"
dependencies = ["kokoro==0.9.4", "soundfile>=0.13", "torch>=2.6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
